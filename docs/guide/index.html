<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYNOX 安裝教學</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一步一步教你把 SYNOX 裝到 Windows 電腦上、接上 Telegram、裝第一個工具。一頁只講一件事，每一步都畫出你會看到的畫面。">
<!--
  SYNOX 一步一步安裝教學（docs/guide/index.html）。一個檔案、不用網路以外的東西（字型從 Google Fonts，載不到就用系統字）。

  ── 步驟資料的格式（之後 SYNOX 的「教學 pack」可以直接拿 STEPS 這個陣列來用）──────────────────────────
  STEPS 是一個陣列，一個元素＝一個畫面（一步）。欄位：
    id        字串，唯一。英文小寫加連字號。主線步驟的網址是 #step-<第幾步>（從 1 數）；岔路、選讀步驟的網址是 #step-<id>
              （主線步驟寫 #step-<id> 也找得到，會自動換成號碼）。
    chapter   字串，這一步屬於哪一段（顯示在進度條上，例如「安裝精靈」）。
    title     字串，這一步的標題（一句話，說要做什麼）。
    body      字串陣列，一個字串＝一段（一兩句白話）。可以有 <b>、<code>；整行的指令用 <code class="cmd">。
    mock      字串，示意畫面的代號，對應 MOCKS 物件裡的函式（例如 "wizard-token"、"tg-pair"）。
              示意畫面裡可以被標出來的東西都有 data-hl="<名字>"。整個 step 會傳給那個函式，
              所以同一個示意畫面要畫成幾種樣子時，在 step 上多放一個欄位給它看（例如 stage: "model"）。
    targets   陣列，要標出來（脈動的圈＋小標籤）的東西：{ id: data-hl 的名字, say: 標籤上的字, place: 標籤位置 }
              place：b＝下面置中（預設）、bs＝下面靠左、be＝下面靠右、a＝上面置中、as／ae＝上面靠左／右、r＝右邊。
    tips      陣列（可省略）：{ k: 種類, t: 文字 }。k＝"if"（如果出現…）、"note"（小提示）、"warn"（注意）、
              "wip"（⏳ 尚未完成）、"ok"（好消息）。
    links     陣列（可省略）：{ href, text, primary? }，顯示成大按鈕（外部連結開新分頁）。
    jump      物件或陣列（可省略）：{ to: 另一步的 id, text } ，顯示成「改走另一條路」的按鈕（例如改用 Discord）；陣列＝好幾顆。

  三種步驟：
  1. 主線：沒有 branch、也沒有 path。順序就是陣列裡的順序；只有主線算在「步驟 N／總數」裡。
  2. 岔路（一定要走其中一條）：
    choices   陣列：這一步是「選一條路」的分岔。一張大卡片一條路：{ path: PATHS 裡的代號, title, sub: 一句話, icon: I 裡的名字 }。
              mock 寫 "paths"（把卡片畫在示意畫面的位置）。點了卡片就走到那條路的第一步，並記住選了哪一條
              （下次回到這一步，「下一步」直接走上次那條；還沒選過時「下一步」不能按）。
    path      字串：這一步在哪一條岔路上（PATHS 裡的代號）。同一條路的步驟照陣列裡的順序走；
              第一步的「上一步」回到分岔那一步，最後一步的「下一步」接回 PATHS[代號].to。
              岔路上的步驟也可以有 choices（岔路裡再分岔）；那條子岔路的 from 寫這一步的 id。
    PATHS 物件：代號 → { label: 這條路的名字（顯示在進度條和目錄上）, from: 分岔那一步的 id, to: 走完接回哪一步的 id }。
              進度條在岔路上顯示「步驟 N／總數＋這條路的名字＋第幾步／共幾步」，N 是分岔那一步在主線上的號碼。
  3. 選讀（不看也裝得完）：
    branch    true＝選讀，不算在「步驟 N／總數」裡；要配 back（「回去」到哪一步的 id）和 next（「接著做」到哪一步的 id）。
              back／next 可以寫 "@from"＝從哪一步按按鈕進來，就回到哪一步（記在這個分頁裡）；
              直接開網址、從目錄進來時不知道從哪來，就用 home（一步的 id）。

  「選讀：SYNOX 網頁導覽」那幾步不是寫在 STEPS 裡：來自 SYNOX 內建新手教學的步驟檔（src/synox/tour/tours/basics.json），
  由 scripts/build_guide.py 放進下面 id 是 tour-steps 的那個 JSON 區塊（同一份字：網頁裡的 /tutorial 也用它）。
  示意畫面上的位置用同一份名字（src/synox/tour/anchors.py 的 data-tour 名字＝這裡的 data-hl）。改那幾步的字：改 basics.json、跑 build_guide.py。

  版本與下載連結不寫死在步驟裡：id 是 release-info 的那個 JSON 區塊（這一版的號碼、SYNOX-<版本>.zip 與 SYNOX-Setup-<版本>.exe 的
  檔名和下載網址）也是 scripts/build_guide.py 產生的，版本讀 pyproject.toml。步驟和示意畫面用 REL.zip、REL.zipUrl… 取用。
  每次發版（alpha、beta 也算）：跑 python scripts/build_guide.py（會順便重蓋頁面版本），再重新發佈同一個線上網址，
  打開確認版本與下載連結是剛發的那一版（docs/release-playbook.md 第 7 節）。
  改了步驟或示意畫面之後：node scripts/check_guide.js（不開瀏覽器，檢查每一步的示意畫面、要標的東西、網址、岔路進得去回得來）。

  畫面上的字都照 SYNOX 原始碼裡真的字（安裝精靈 src/synox/wizard/lang/zh_TW.py、網頁 src/synox/web/static/app.html、
  packdrop.js、Setup.bat 的 setup/lang/zh-TW.psd1；設定頁 AI 來源的選項 src/synox/llm/sources.py 與 ntu_easy_llm 的來源目錄；
  更新與套件 src/synox/update/；LLOP 的指令與輸出照 LLOP 的 docs/CLI.md、docs/SDK.md）。
  Windows、Telegram、GitHub 自己的畫面是照常見的樣子畫的示意圖。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 版面：一次只看一步。手機是一欄（標題 → 說明 → 示意畫面 → 小提示），底下黏著兩顆大按鈕；
   電腦上左邊說明、右邊示意畫面。配色、字型跟 SYNOX 首頁（docs/landing/page.html）同一套。 */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunken: #eef1f5; --line: #e2e7ee; --line-2: #cdd5df;
  --ink: #131b26; --muted: #465264; --faint: #6a7687;
  --accent: #0a7c70; --accent-soft: #d9f1ec; --accent-ink: #ffffff; --ring: rgba(10,124,112,.55);
  --ok: #1f7a3a; --ok-soft: #dcf3e3; --warn: #9a5b00; --warn-soft: #fbeccf; --bad: #b42318; --bad-soft: #fde3df;
  --shadow: 0 1px 2px rgba(19,27,38,.05), 0 10px 28px -14px rgba(19,27,38,.22);
  --glow: radial-gradient(60% 50% at 85% 0%, rgba(10,124,112,.12), transparent 70%);
  /* 示意畫面用的顏色 */
  --frame: #c9d1db; --win-bar: #e8ecf1; --win-sel: #cfe6f7; --menu: #ffffff; --folder: #e8b33a; --folder-ink: #8a6200;
  --doc: #ffffff; --doc-line: #9aa6b5;
  --con-bg: #0c0c0c; --con-fg: #cfd6de; --con-dim: #8a96a5; --con-hi: #5fe0c9;
  --ss-bg: #1f5fa8; --ss-fg: #ffffff; --ss-btn: #ffffff; --ss-btn-ink: #1f5fa8;
  --tg-bar: #2aabee; --tg-bar-fg: #ffffff; --tg-chat: #dfe7ee; --tg-in: #ffffff; --tg-in-fg: #131b26;
  --tg-out: #effdde; --tg-out-fg: #131b26; --tg-link: #1a73c5; --tg-compose: #f4f7f9;
  --display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f14; --surface: #121924; --sunken: #0d131b; --line: #1f2b3b; --line-2: #2d3b4f;
    --ink: #dbe4ef; --muted: #aab6c6; --faint: #7f90a7;
    --accent: #35e0c4; --accent-soft: #123b38; --accent-ink: #06201c; --ring: rgba(53,224,196,.6);
    --ok: #57d98a; --ok-soft: #10301e; --warn: #e6b04e; --warn-soft: #3a2a0b; --bad: #ff8a7a; --bad-soft: #43171a;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 14px 36px -16px rgba(0,0,0,.75);
    --glow: radial-gradient(60% 50% at 85% 0%, rgba(53,224,196,.13), transparent 70%);
    --frame: #2b3948; --win-bar: #1a2433; --win-sel: #18394f; --menu: #1b2533; --folder: #d9a531; --folder-ink: #6b4b00;
    --doc: #dfe5ec; --doc-line: #6e7b8c;
    --ss-bg: #1d4f8a; --ss-btn: #e9f1fb; --ss-btn-ink: #163f6e;
    --tg-bar: #17212b; --tg-bar-fg: #e6edf3; --tg-chat: #0e1621; --tg-in: #182533; --tg-in-fg: #e6edf3;
    --tg-out: #2b5278; --tg-out-fg: #ffffff; --tg-link: #6ab3f3; --tg-compose: #17212b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f14; --surface: #121924; --sunken: #0d131b; --line: #1f2b3b; --line-2: #2d3b4f;
  --ink: #dbe4ef; --muted: #aab6c6; --faint: #7f90a7;
  --accent: #35e0c4; --accent-soft: #123b38; --accent-ink: #06201c; --ring: rgba(53,224,196,.6);
  --ok: #57d98a; --ok-soft: #10301e; --warn: #e6b04e; --warn-soft: #3a2a0b; --bad: #ff8a7a; --bad-soft: #43171a;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 14px 36px -16px rgba(0,0,0,.75);
  --glow: radial-gradient(60% 50% at 85% 0%, rgba(53,224,196,.13), transparent 70%);
  --frame: #2b3948; --win-bar: #1a2433; --win-sel: #18394f; --menu: #1b2533; --folder: #d9a531; --folder-ink: #6b4b00;
  --doc: #dfe5ec; --doc-line: #6e7b8c;
  --ss-bg: #1d4f8a; --ss-btn: #e9f1fb; --ss-btn-ink: #163f6e;
  --tg-bar: #17212b; --tg-bar-fg: #e6edf3; --tg-chat: #0e1621; --tg-in: #182533; --tg-in-fg: #e6edf3;
  --tg-out: #2b5278; --tg-out-fg: #ffffff; --tg-link: #6ab3f3; --tg-compose: #17212b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); background-image: var(--glow); background-repeat: no-repeat;
  color: var(--ink); font: 19px/1.75 var(--body); }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
code { font-family: var(--mono); font-size: .88em; background: var(--sunken); border: 1px solid var(--line); padding: 1px 7px; border-radius: 7px; }
p { margin: 0; }

.wrap { width: min(1120px, 100%); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 頁首：品牌、全部步驟、進度條 */
.top { padding-block: 14px 6px; display: grid; gap: 12px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 18px; }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-weight: 700; font-size: 20px; flex: none; }
.brand small { color: var(--faint); font-weight: 500; font-size: 15px; }
.toc { position: relative; }
.toc summary { list-style: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-size: 16px; font-weight: 500; color: var(--ink); }
.toc summary::-webkit-details-marker { display: none; }
.toc summary svg { width: 18px; height: 18px; }
.toc-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(380px, calc(100vw - 32px));
  max-height: min(70vh, 560px); overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 8px; }
.toc-panel ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc-panel .ch { font-size: 13px; color: var(--faint); letter-spacing: .08em; padding: 10px 10px 2px; }
.toc-panel a { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink);
  font-size: 16px; line-height: 1.45; min-height: 44px; align-items: center; }
.toc-panel a .n { flex: none; width: 2.2em; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.toc-panel a:hover { background: var(--sunken); }
.toc-panel a[aria-current="step"] { background: var(--accent-soft); font-weight: 700; }

.progress { display: grid; gap: 6px; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.step-count { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.step-count .of { color: var(--faint); font-weight: 500; }
.chapter { font-size: 15px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .35s ease; }
.branch-tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

.resume { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 14px; border-radius: var(--r);
  background: var(--accent-soft); color: var(--ink); font-size: 17px; }
.resume .btn { min-height: 44px; font-size: 16px; padding: 6px 16px; }

/* 一步 */
main { padding-block: 14px 0; }
.stage { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.text { display: grid; gap: 14px; min-width: 0; }
.stage h1 { font-family: var(--display); font-weight: 700; font-size: clamp(27px, 6.2vw, 38px); line-height: 1.3; margin: 0; text-wrap: balance; }
.stage h1:focus { outline: none; }
.body { display: grid; gap: 10px; max-width: 34em; }
.body p { font-size: 19px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.tips { display: grid; gap: 10px; }
.tip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 12px 14px; border-radius: 12px;
  background: var(--sunken); border: 1px solid var(--line); font-size: 17px; line-height: 1.65; }
.tip .k { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; margin-top: 2px; background: var(--surface); color: var(--muted); border: 1px solid var(--line-2); }
.tip.if .k { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tip.warn { background: var(--bad-soft); border-color: transparent; }
.tip.warn .k { background: var(--surface); color: var(--bad); border-color: transparent; }
.tip.wip { background: var(--warn-soft); border-color: transparent; }
.tip.wip .k { background: var(--surface); color: var(--warn); border-color: transparent; }
.tip.ok { background: var(--ok-soft); border-color: transparent; }
.tip.ok .k { background: var(--surface); color: var(--ok); border-color: transparent; }
.tip > span:last-child { min-width: 0; overflow-wrap: anywhere; }

.figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.mock { min-width: 0; padding: 18px 14px 26px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); overflow: hidden; display: grid; justify-items: center; }
.mock > * { width: 100%; max-width: 100%; }
.figure figcaption { font-size: 14px; color: var(--faint); text-align: center; }

/* 按鈕 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; border-radius: 14px;
  border: 2px solid var(--line-2); background: var(--surface); color: var(--ink); font: 700 19px/1.3 var(--body); text-decoration: none; cursor: pointer; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.04); }
.btn[disabled] { opacity: .4; cursor: default; filter: none; }

.navbar { position: sticky; bottom: 0; z-index: 20; margin-top: 26px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.navbar .btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; }
.navbar .btn { width: 100%; min-height: 60px; font-size: 20px; white-space: nowrap; padding-inline: 12px; }
.kbd-hint { display: none; text-align: center; font-size: 13px; color: var(--faint); margin-top: 6px; }

footer { padding-block: 22px 28px; }
.stamp { font-family: var(--mono); font-size: 11px; color: var(--faint); opacity: .7; overflow-wrap: anywhere; text-align: center; }

@media (min-width: 900px) {
  body { font-size: 20px; }
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto 1fr; gap: 22px 40px; padding-top: 10px; }
  .stage > .text { grid-column: 1; grid-row: 1; }
  .stage > .tips { grid-column: 1; grid-row: 2; align-self: start; }
  .stage > .figure { grid-column: 2; grid-row: 1 / span 2; }
  .body p { font-size: 20px; }
  .navbar .btns { grid-template-columns: 220px 320px; justify-content: end; }
  .kbd-hint { display: block; text-align: right; }
  .mock { padding: 26px 24px 34px; }
}

/* ── 標出要按的地方：脈動的圈＋小標籤 ─────────────────────────── */
.hl.room-b { margin-bottom: 42px !important; }
.hl.room-a { margin-top: 42px !important; }
.wb > .hl, .frame-l > .hl { justify-self: start; }
.row > .hl { align-self: flex-start; }
.kb .r { align-items: end; }
span.hl { display: inline-block; }
.hl { position: relative; z-index: 2; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--ring); }
.hl::after { content: ""; position: absolute; inset: -4px; border-radius: 12px; border: 3px solid var(--accent); pointer-events: none;
  animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.25); } }
.tap { position: absolute; z-index: 5; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); font: 700 14px/1.2 var(--body); padding: 6px 10px; border-radius: 9px;
  box-shadow: 0 6px 16px -6px rgba(0,0,0,.45); pointer-events: none; letter-spacing: .02em; }
.tap::before { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--accent); }
.tap.bs { left: 0; transform: none; } .tap.bs::before { left: 18px; }
.tap.be { left: auto; right: 0; transform: none; } .tap.be::before { left: auto; right: 12px; }
.tap.a, .tap.as, .tap.ae { top: auto; bottom: calc(100% + 12px); }
.tap.a::before, .tap.as::before, .tap.ae::before { top: auto; bottom: -6px; border-bottom: 0; border-top: 6px solid var(--accent); }
.tap.as { left: 0; transform: none; } .tap.as::before { left: 18px; }
.tap.ae { left: auto; right: 0; transform: none; } .tap.ae::before { left: auto; right: 12px; }
.tap.r { top: 50%; left: calc(100% + 12px); transform: translateY(-50%); }
.tap.r::before { top: 50%; left: -6px; margin: -6px 0 0; border: 6px solid transparent; border-left: 0; border-right-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {

}

/* ── 示意畫面：共用 ─────────────────────────────────────────── */

/* Windows SmartScreen */
.ss { background: var(--ss-bg); color: var(--ss-fg); border-radius: 6px; padding: 18px 18px 16px; display: grid; gap: 10px; text-align: left; line-height: 1.55;
  box-shadow: 0 14px 30px -18px rgba(0,0,0,.6); }

/* 手機 Telegram */
.phone { max-width: 330px; margin: 0 auto; border: 2px solid var(--frame); border-radius: 26px; overflow: hidden; background: var(--tg-chat);

.tg-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--tg-bar); color: var(--tg-bar-fg); font-size: 14px; line-height: 1.25; }

.msg.ghost { background: transparent; border: 1.5px dashed var(--line-2); color: var(--muted); font-style: italic; }
.msg.pre { white-space: pre-line; }
.kb { display: grid; gap: 4px; justify-self: stretch; max-width: 92%; }

.kb span { text-align: center; padding: 5px 4px; border-radius: 8px; background: rgba(42,171,238,.22); color: var(--tg-in-fg); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys { justify-self: center; font-size: 11px; color: #fff; background: rgba(20,40,60,.5); padding: 2px 9px; border-radius: 10px; }

.land { text-align: center; justify-items: center; }

.big-dl { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; }

.login-card { justify-self: center; width: min(300px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; text-align: center; justify-items: center; }

.app { display: grid; grid-template-columns: 112px minmax(0, 1fr); background: var(--bg); min-height: 280px; }

.app .mainp { padding: 12px; display: grid; gap: 9px; min-width: 0; align-content: start; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.tabs span { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.tabs span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card2 { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 7px; font-size: 13px; min-width: 0; }

.flow { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; margin: 0; padding: 0; list-style: none; }
.flow li { padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--faint); }
.flow li.d { background: var(--ok-soft); color: var(--ok); }

.review { background: var(--sunken); }

@media (max-width: 460px) { .app { grid-template-columns: minmax(0, 1fr); } .app .side { display: none; } }

/* 開始前、完成 */
.need { display: grid; gap: 10px; width: 100%; max-width: 420px; }

.done-card .big svg { width: 50px; height: 50px; }
.done-card h4 { margin: 0; font-family: var(--display); font-size: 30px; }
.try { display: grid; gap: 8px; width: 100%; max-width: 380px; text-align: left; }
.try div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--sunken); }
.try code { justify-self: start; font-size: 15px; }
.try small { color: var(--muted); font-size: 14px; line-height: 1.5; }

/* ── 岔路：進度條上的名字、目錄裡的縮排 ─────────────────────── */
.branch-tag.way { background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.toc-panel li.way { font-size: 13px; font-weight: 700; color: var(--accent); padding: 8px 10px 0 46px; line-height: 1.4; }

.toc-panel li.way.d2 { padding-left: 70px; }
.toc-panel a.sub.d2 { padding-left: 58px; }

/* ── 選一條路（分岔）：上面一張小路線圖，下面一條路一張大卡片 ───────── */
.paths { display: grid; gap: 12px; width: 100%; max-width: 520px; }
.fork { display: grid; justify-items: center; gap: 2px; font-size: 12.5px; color: var(--faint); }
.fork svg { display: block; width: 100%; max-width: 380px; height: auto; overflow: visible; }
.fork path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
.fork circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2.2; }
.fork circle.end { fill: var(--accent); }
.fork .cap { display: flex; justify-content: space-between; width: 100%; max-width: 380px; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.path-card { display: grid; grid-template-columns: 52px minmax(0, 1fr) 22px; gap: 14px; align-items: center; width: 100%; min-height: 92px;
  padding: 14px 14px 14px 16px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--surface); color: var(--ink);
  font: inherit; text-align: left; cursor: pointer; box-shadow: var(--shadow);
  animation: rise .4s ease both; animation-delay: calc(var(--i, 0) * 80ms);
  transition: border-color .15s ease, background-color .15s ease, transform .15s ease; }
.path-card:hover, .path-card:focus-visible { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
.path-card:active { transform: none; }
.path-card .pi { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  transition: background-color .15s ease, color .15s ease; }
.path-card:hover .pi, .path-card:focus-visible .pi { background: var(--accent); color: var(--accent-ink); }
.path-card .pi svg { width: 28px; height: 28px; }
.path-card .pt { display: grid; gap: 2px; min-width: 0; }
.path-card b { font-size: 19px; line-height: 1.4; overflow-wrap: anywhere; }
.path-card small { font-size: 15px; line-height: 1.55; color: var(--muted); overflow-wrap: anywhere; }
.path-card em { justify-self: start; margin-top: 4px; font-style: normal; font-size: 12.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); }
.path-card .go { color: var(--accent); }
.path-card .go svg { width: 22px; height: 22px; display: block; }
.path-card.was { border-color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (max-width: 420px) { .path-card { grid-template-columns: 44px minmax(0, 1fr) 18px; gap: 10px; padding: 12px; } .path-card .pi { width: 44px; height: 44px; } }
@media (prefers-reduced-motion: reduce) { .fork path { animation: none; } .path-card { animation: none; transition: none; } .path-card .pi { transition: none; } }

/* ── 整行的指令、長網址：窄螢幕上要能換行 ───────────────────── */
.body p, .links .btn { overflow-wrap: anywhere; }
.cmd { display: block; padding: 10px 12px; font-size: .8em; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.field.hl { overflow: visible; white-space: normal; overflow-wrap: anywhere; }   /* 被標出來的輸入格：小標籤要露在格子外面 */

/* ── 示意畫面：設定頁的欄位（AI 從哪裡來、SYNOX 更新）────────────── */
.kv { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: center; }
.kv > b { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.lab { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.field.sel { font-family: var(--body); font-size: 13px; background: var(--surface); }
.opts { display: grid; gap: 1px; padding: 4px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--menu); box-shadow: 0 12px 26px -16px rgba(0,0,0,.5); font-size: 13px; }
.opts span { padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.opts .on { background: var(--win-sel); font-weight: 700; }
.opts .dis { color: var(--faint); }
.rule2 { height: 1px; background: var(--line); margin: 2px 0; }

             { k: "warn", t: "要傳給<b>你自己的 bot</b>，不是傳給 BotFather。" }] },

    /* ── 精靈第 4 步「AI 從哪裡來」：選一條路（三條岔路，走完都接回 finish）── */

      body: ["精靈現在停在「<b>AI 從哪裡來</b>」。AI 是 SYNOX 的腦袋：有了它，你可以用平常說話的方式跟 SYNOX 講。",
             "看這一頁的三張卡片，<b>點你符合的那一張</b>，這份教學就帶你走那條路。三條路走完，都會接回同一個地方。"],
      mock: "paths", targets: [],
      choices: [

    /* 岔路 A：我有 Claude 訂閱 */
    { id: "ai-claude", path: "claude", chapter: "安裝精靈", title: "看到「✅ 找到了」，就按下一步",
      body: ["SYNOX 預設用這台電腦登入的 <b>Claude Code</b> 當它的腦袋，最上面那一個已經幫你選好了。",
             "它下面如果寫「<b>✅ 找到了</b>」，什麼都不用改，直接按「<b>下一步 ▶</b>」。"],
      mock: "wizard-ai-found", targets: [{ id: "found", say: "看到 ✅ 就好", place: "b" }, { id: "next", say: "按這裡", place: "ae" }],
      jump: { to: "finish", text: "我看到 ✅ 了，跳到最後一步" },
      tips: [{ k: "if", t: "寫的是「❌ 這台電腦找不到 Claude Code」：按這份教學最下面的「下一步」，看怎麼一鍵安裝。" },
             { k: "note", t: "想確定真的通：按「測一下」，看到「✅ 通了！AI 有回話。」就是好了。" }] },

    { id: "ai-install", path: "claude", chapter: "安裝精靈", title: "找不到 Claude Code？按「一鍵安裝」",
      body: ["① 按「<b>一鍵安裝（PowerShell）</b>」，會打開一個新的視窗，自己把 Claude Code 裝好。",
             "② 裝好之後，<b>還要登入才能用</b>：在那個視窗打 <code>claude</code>，按 Enter，照畫面用你的 Claude 帳號登入一次。",
             "③ 回到精靈，按「<b>裝好了，重新偵測</b>」。再按「<b>測一下</b>」，看到「✅ 通了！AI 有回話。」才算真的好了，然後按「下一步 ▶」。"],
      mock: "wizard-ai-missing", targets: [{ id: "install", say: "1 先按這裡", place: "a" }, { id: "redetect", say: "2 裝好再按", place: "be" }],
      jump: { to: "ai", text: "我沒有 Claude 帳號，回去改選別條路" },
      tips: [{ k: "note", t: "裝的是 Claude 官方的安裝指令，不用系統管理員。也可以按「打開下載網頁」看官方說明。" },
             { k: "warn", t: "「重新偵測」只會看程式有沒有裝好，<b>不會</b>看你有沒有登入。沒登入的話，AI 不會回話，所以一定要按「測一下」確認。" },
             { k: "warn", t: "登入要有 Claude 的帳號（需要付費方案）。" }] },

    /* 岔路 B：我有自己的模型或 API（裡面再分三條） */
    { id: "ai-own", path: "own", chapter: "安裝精靈", title: "你有的是哪一種？",
      body: ["自己的模型或 API 有三種，做法不一樣。",
             "<b>點你有的那一種。</b>"],
      mock: "paths", targets: [],
      choices: [
        { path: "own-key", icon: "key", title: "一把 API 金鑰", sub: "OpenAI、Gemini、Anthropic 給的 key，或公司給你的網址和金鑰。" },
        { path: "own-local", icon: "chip", title: "電腦上的本地模型", sub: "這台或家裡網路的電腦上，有 Ollama、LM Studio 或 vLLM 在跑。" },
        { path: "own-llop", icon: "share", title: "別人分享的 LLOP", sub: "有人用 LLOP 把他的模型分享給你，給了你一個 API 連結和一把 key。" }],
      tips: [{ k: "note", t: "看不懂這三個是什麼？按「上一步」，改選「先不用 AI」就好。" }] },

    { id: "ai-key", path: "own-key", chapter: "安裝精靈", title: "選「用我自己（或公司）的金鑰」，貼上 key，按「測一下」",
      body: ["① 點「<b>用我自己（或公司）的金鑰</b>」。「哪一家」選你的 key 是哪一家給的。",

             "③ 按「<b>測一下</b>」。看到「<b>✅ 通了！AI 有回話。</b>」之後，「下一步 ▶」才能按。"],
      mock: "wizard-ai-key", targets: [{ id: "own", say: "1 選這個", place: "a" }, { id: "key", say: "2 貼上 key", place: "be" }, { id: "test", say: "3 按這裡", place: "bs" }],

             { k: "note", t: "公司給你的是「一個網址＋一把金鑰」：「哪一家」選「<b>相容端點（公司閘道、Ollama）</b>」，會多一格「網址」，把網址貼進去。" },
             { k: "note", t: "「模型」那一格已經先填好一個常用的，不確定就不要改。裝好之後，可以在網頁按「列出模型」從清單挑。" },
             { k: "warn", t: "API key 就像密碼，<b>不要傳給別人</b>、不要貼到群組。" }] },

             "③ 按「<b>測一下</b>」。看到「<b>✅ 找到模型，設定看起來合理</b>」之後，「下一步 ▶」才能按。"],
      mock: "wizard-ai-local", targets: [{ id: "local", say: "1 選這個", place: "a" }, { id: "model", say: "2 模型的名字", place: "be" }, { id: "test", say: "3 按這裡", place: "be" }],
      jump: { to: "webai-open", text: "看看之後在網頁怎麼換模型（選讀）" },

             { k: "note", t: "「Context 長度」不確定，就按「<b>看建議</b>」：它只讀取模型資料與這台電腦的記憶體，不會載入模型。" },

             "裝好、看到 SYNOX 的網頁之後，再照「接 LLOP」那幾頁做。這份教學最後一頁「完成！」有按鈕帶你過去。"],
      mock: "wizard-ai-none", targets: [{ id: "none", say: "先選這個", place: "a" }, { id: "next", say: "再按這裡", place: "ae" }],
      jump: { to: "llop-ready", text: "先看看之後要做什麼（接 LLOP）" },

             { k: "note", t: "<b>方法二</b>：打開 SYNOX 的網頁，到「設定 → 🤖 AI」選。這份教學最後一頁「完成！」有按鈕帶你過去。" }] },

    { id: "finish", chapter: "安裝精靈", title: "最後一步：按「完成並開始」",

             "按右下角的「<b>完成並開始</b>」。精靈會寫好設定、打開 SYNOX，然後按鈕會變成「關閉」，按它關掉精靈。"],

      tips: [{ k: "warn", t: "工作列上會多一個縮小的黑色視窗，那就是 SYNOX 本人。<b>關掉它 SYNOX 就停了。</b>" },
             { k: "note", t: "以後要打開 SYNOX：點兩下桌面上的「SYNOX」捷徑。" }] },

             "SYNOX 會在畫面上把要按的地方圈起來，一步一步帶你認識：怎麼聊天、工具在哪、怎麼裝和移除工具。"],
      mock: "web-tour-offer", targets: [{ id: "start", say: "按這裡", place: "bs" }],
      tips: [{ k: "note", t: "按了「之後再說」也沒關係：在網頁的對話框或 Telegram 打 <code>/tutorial</code>（或直接打「開始教學」），隨時都能再看一次。" },
             { k: "note", t: "在 Telegram、Discord 打 <code>/tutorial</code>，會用一張一張的步驟卡帶你走。教學只會指給你看，不會替你按確認。" }] },

    { id: "tools", chapter: "開始使用", title: "到「設定 → 功能與安裝」挑工具",
      body: ["剛裝好的 SYNOX 沒有工具（只有內建的提醒）。工具要自己挑，就像手機裝 App。",
             "在網頁按左邊的「<b>設定</b>」→ 上面的「<b>🧩 功能與安裝</b>」→ 在「工具庫（官方）」按「<b>看有哪些工具</b>」，找到「隨手記」，按「<b>安裝</b>」。"],
      mock: "web-catalog", targets: [{ id: "tab", say: "1 先到「🧩 功能與安裝」", place: "bs" }, { id: "install", say: "2 按安裝", place: "bs" }],
      links: [{ href: LIBS_URL, text: "看全部工具（工具庫）", icon: "book" }],

             { k: "if", t: "載入清單出現錯誤：檢查網路；或到工具庫的 GitHub 發佈頁下載 <code>.synoxpack</code> 檔，點兩下安裝。" }] },

    { id: "confirm", chapter: "開始使用", title: "看報告，按「確認安裝」",
      body: ["按了「安裝」，SYNOX 會自己下載、核對檔案，再列出這個工具是什麼、安全檢查的結果。看到「<b>✅ 宣告檢查、靜態掃描都過了</b>」就可以放心。",
             "按「<b>確認安裝</b>」。出現「✅ 裝好了：notes」就完成了。"],
      mock: "web-review", targets: [{ id: "ok", say: "按這裡", place: "bs" }],
      tips: [{ k: "warn", t: "報告裡出現紅色的「❌ 拒裝：安全檢查沒過」，就不要裝這個檔案。" },

    { id: "look", chapter: "開始使用", title: "想換個樣子：設定 → 🎨 外觀",

             "裝了外觀包，就能在這裡按「<b>套用</b>」換一整套顏色、字型和吉祥物；按「<b>換回原本的 SYNOX</b>」隨時換回來。"],

    });
    (step.jump ? [].concat(step.jump) : []).forEach(function (j) {
      links.push('<button class="btn" type="button" data-jump="' + j.to + '">' + I.branch + j.text + '</button>');
    });
    $("links").innerHTML = links.join("");
    $("links").hidden = !links.length;
    $("tips").innerHTML = (step.tips || []).map(function (t) {
      return '<p class="tip ' + t.k + '"><span class="k">' + tipLabel(t.k) + '</span><span>' + t.t + '</span></p>';
    }).join("");
    $("tips").hidden = !(step.tips || []).length;

    var mock = $("mock");
    mock.innerHTML = MOCKS[step.mock] ? MOCKS[step.mock](step) : "";
    (step.targets || []).forEach(function (t) {
      var el = mock.querySelector('[data-hl="' + t.id + '"]');
      if (!el) { if (window.console) { console.warn("找不到要標的東西：" + step.id + " / " + t.id); } return; }
      el.classList.add("hl");
      var pl = t.place || "b";
      if (pl !== "r") { el.classList.add(pl.charAt(0) === "a" ? "room-a" : "room-b"); }
      var tap = document.createElement("span");
      tap.className = "tap " + (t.place || "b");
      tap.textContent = t.say;
      el.appendChild(tap);
    });
    $("caption").textContent = NO_CAPTION[step.mock] ? "" : "示意圖：畫的是你會看到的畫面，顏色、字型會跟你的電腦有一點不同。";
    $("caption").hidden = !$("caption").textContent;

    // 進度：岔路上的步驟算在分岔那一步，進度條在那一格裡再往前一點
    var shown = step.branch ? anchorNumber(step) : step.path ? n + place.at / (place.of + 1) : n;
    $("count").innerHTML = step.branch ? '<span class="branch-tag">選讀</span>' :
      "步驟 " + n + '<span class="of">／' + TOTAL + "</span>" +
      (way ? '<span class="branch-tag way">' + way + (place.of > 1 ? " " + place.at + "／" + place.of : "") + "</span>" : "");
    $("chapter").textContent = step.chapter;
    $("bar-fill").style.width = (shown / TOTAL * 100) + "%";
    $("bar").setAttribute("aria-valuenow", String(Math.floor(shown)));
    $("bar").setAttribute("aria-valuemax", String(TOTAL));
    $("bar").setAttribute("aria-valuetext", step.branch ? "選讀" :
      "步驟 " + n + "，共 " + TOTAL + " 步" + (way ? "。岔路「" + way + "」第 " + place.at + " 步，共 " + place.of + " 步" : ""));

    // 按鈕
    var prev = $("prev"), next = $("next"), nx = nextOf(step);
    var last = !step.branch && !step.path && n === TOTAL;
    prev.disabled = !prevOf(step);
    prev.lastChild.textContent = step.branch ? "回去" : "上一步";
    next.disabled = !nx;
    next.firstChild.textContent = !nx ? "先選一條路" : step.branch ? "接著做" : last ? "從頭再看一次" : "下一步";
    next.querySelector("svg").style.display = last || !nx ? "none" : "";

    // 目錄
    Array.prototype.forEach.call(document.querySelectorAll("#toc-panel a"), function (a) {
      if (a.getAttribute("href") === hashFor(step)) { a.setAttribute("aria-current", "step"); } else { a.removeAttribute("aria-current"); }
    });
    $("toc").open = false;
    if (n !== 1 || step.branch) { $("resume").hidden = true; }
    if (!quiet) { save(step); }
  }

  function nextStep() { if (current) { go(nextOf(current)); } }
  function prevStep() { if (current) { go(prevOf(current)); } }
  function moved() {
    var s = fromHash() || MAIN[0];
    if (location.hash !== hashFor(s)) {            // #step-<主線步驟的 id>、改版前的網址：換成現在的寫法（不多留一筆上一頁）
      try { history.replaceState(null, "", hashFor(s)); } catch (e) { /* 沒關係 */ }
    }
    render(s);
    try { window.scrollTo(0, 0); } catch (e) { /* 沒關係 */ }
    try { $("title").focus({ preventScroll: true }); } catch (e) { $("title").focus(); }
  }

  // 目錄：主線照號碼；分岔那一步下面縮排列出每一條路；最後是選讀
  (function () {
    var html = "", last = "";
    function item(s, n, cls) {
      return '<li><a' + (cls ? ' class="' + cls + '"' : "") + ' href="' + hashFor(s) + '"><span class="n">' + n + "</span><span>" + plain(s.title) + "</span></a></li>";
    }
    function ways(s, depth) {
      return s.choices.map(function (c) {
        return '<li class="way d' + depth + '">' + PATHS[c.path].label + "</li>" + pathSteps(c.path).map(function (ps) {
          return item(ps, "↳", "sub d" + depth) + (ps.choices ? ways(ps, depth + 1) : "");
        }).join("");
      }).join("");
    }
    MAIN.forEach(function (s, i) {
      if (s.chapter !== last) { html += (last ? "</ol>" : "") + '<p class="ch">' + s.chapter + "</p><ol>"; last = s.chapter; }
      html += item(s, i + 1) + (s.choices ? ways(s, 1) : "");
    });
    var lastBranch = "";
    STEPS.filter(function (s) { return s.branch; }).forEach(function (s) {
      if (s.chapter !== lastBranch) { html += '</ol><p class="ch">' + s.chapter + '</p><ol>'; lastBranch = s.chapter; }
      html += item(s, "＋");
    });
    $("toc-panel").innerHTML = html + "</ol>";
  })();

  $("next").addEventListener("click", nextStep);
  $("prev").addEventListener("click", prevStep);
  $("links").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-jump]") : null;
    if (b) { jumpTo(b.getAttribute("data-jump")); }
  });
  $("mock").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-path]") : null;
    if (b) { choose(b.getAttribute("data-path")); }
  });
  $("toc-panel").addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a") : null;
    if (!a) { return; }
    $("toc").open = false;
    var t = byId((a.getAttribute("href") || "").replace("#step-", ""));
    if (t && t.branch && froms[t.chapter]) { delete froms[t.chapter]; keep("sessionStorage", FROM_KEY, froms); }   // 從目錄進選讀：不算「從哪一步來」
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) { return; }
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) { return; }
    if (e.key === "ArrowRight") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
    else if (e.key === "Escape") { $("toc").open = false; }
  });
  window.addEventListener("hashchange", moved);

  // 第一次打開：網址有 #step-N 就去那一步；沒有的話，記得上次看到哪裡就問要不要接著看
  var start = fromHash();
  var saved = load();
  render(start || MAIN[0], !start);
  if (!start && saved && saved.id !== MAIN[0].id) {
    $("resume-text").textContent = "上次看到「" + (saved.branch ? "選讀" : "步驟 " + anchorNumber(saved)) + "：" + plain(saved.title) + "」";
    $("resume").hidden = false;
    $("resume-go").addEventListener("click", function () { $("resume").hidden = true; go(saved); });
    $("resume-no").addEventListener("click", function () { $("resume").hidden = true; save(MAIN[0]); });
  }
  /* 給外面看的（除錯、之後的教學 pack、檢查步驟資料用）：check() 回傳找不到的示意畫面、要標的東西、指不到的步驟 */
  function check() {
    var bad = [];
    function need(id, why) { if (!byId(id)) { bad.push(why + " → 沒有步驟 " + id); } }
    STEPS.forEach(function (s) {
      if (!MOCKS[s.mock]) { bad.push(s.id + "：沒有示意畫面 " + s.mock); return; }
      var html = MOCKS[s.mock](s);
      (s.targets || []).forEach(function (t) { if (html.indexOf('data-hl="' + t.id + '"') < 0) { bad.push(s.id + "：示意畫面 " + s.mock + " 裡沒有 data-hl=\"" + t.id + "\""); } });
      (s.jump ? [].concat(s.jump) : []).forEach(function (j) { need(j.to, s.id + " 的 jump"); });
      (s.choices || []).forEach(function (c) {
        if (!PATHS[c.path] || !pathSteps(c.path).length) { bad.push(s.id + "：岔路 " + c.path + " 沒有步驟"); }
        else if (PATHS[c.path].from !== s.id) { bad.push(s.id + "：岔路 " + c.path + " 的 from 不是這一步"); }
      });
      if (s.path && !PATHS[s.path]) { bad.push(s.id + "：PATHS 裡沒有 " + s.path); }
      if (s.branch) {
        ["back", "next"].forEach(function (k) {
          if (s[k] === "@from") { need(s.home, s.id + " 的 home（" + k + " 是 @from）"); } else { need(s[k], s.id + " 的 " + k); }
        });
      }
    });
    Object.keys(PATHS).forEach(function (p) { need(PATHS[p].from, "PATHS." + p + ".from"); need(PATHS[p].to, "PATHS." + p + ".to"); });
    return bad;
  }
  window.SynoxGuide = { STEPS: STEPS, PATHS: PATHS, REL: REL, go: function (id) { go(byId(id)); }, nextOf: nextOf, prevOf: prevOf,
                        hashFor: hashFor, choose: choose, check: check };
})();
</script>
</body>
</html>
