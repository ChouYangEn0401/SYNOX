<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYNOX 安裝教學</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一步一步教你把 SYNOX 裝到 Windows 電腦上、接上 Telegram、裝第一個工具。一頁只講一件事，每一步都畫出你會看到的畫面。">
<!--
  SYNOX 一步一步安裝教學（docs/guide/index.html）。一個檔案、不用網路以外的東西（字型從 Google Fonts，載不到就用系統字）。

  ── 步驟資料的格式（之後 SYNOX 的「教學 pack」可以直接拿 STEPS 這個陣列來用）──────────────────────────
  STEPS 是一個陣列，一個元素＝一個畫面（一步）。欄位：
    id        字串，唯一。英文小寫加連字號。主線步驟的網址是 #step-<第幾步>（從 1 數）；branch 步驟的網址是 #step-<id>。
    chapter   字串，這一步屬於哪一段（顯示在進度條上，例如「安裝精靈」）。
    title     字串，這一步的標題（一句話，說要做什麼）。
    body      字串陣列，一個字串＝一段（一兩句白話）。可以有 <b>、<code>。
    mock      字串，示意畫面的代號，對應 MOCKS 物件裡的函式（例如 "wizard-token"、"tg-pair"）。
              示意畫面裡可以被標出來的東西都有 data-hl="<名字>"。
    targets   陣列，要標出來（脈動的圈＋小標籤）的東西：{ id: data-hl 的名字, say: 標籤上的字, place: 標籤位置 }
              place：b＝下面置中（預設）、bs＝下面靠左、be＝下面靠右、a＝上面置中、as／ae＝上面靠左／右。
    tips      陣列（可省略）：{ k: 種類, t: 文字 }。k＝"if"（如果出現…）、"note"（小提示）、"warn"（注意）、
              "wip"（⏳ 尚未完成）、"ok"（好消息）。
    links     陣列（可省略）：{ href, text, primary? }，顯示成大按鈕（外部連結開新分頁）。
    jump      物件（可省略）：{ to: 另一步的 id, text } ，顯示成「改走另一條路」的按鈕（例如改用 Discord）。
    branch    true＝選讀的岔路，不算在「步驟 N／總數」裡；要配 back（回哪一步的 id）和 next（看完接哪一步的 id）。
  主線的順序就是陣列裡（去掉 branch 之後）的順序。
  畫面上的字都照 SYNOX 原始碼裡真的字（安裝精靈 src/synox/wizard/lang/zh_TW.py、網頁 src/synox/web/static/app.html、
  packdrop.js、Setup.bat 的 setup/lang/zh-TW.psd1）。Windows、Telegram 自己的畫面是照常見的樣子畫的示意圖。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 版面：一次只看一步。手機是一欄（標題 → 說明 → 示意畫面 → 小提示），底下黏著兩顆大按鈕；
   電腦上左邊說明、右邊示意畫面。配色、字型跟 SYNOX 首頁（docs/landing/page.html）同一套。 */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunken: #eef1f5; --line: #e2e7ee; --line-2: #cdd5df;
  --ink: #131b26; --muted: #465264; --faint: #6a7687;
  --accent: #0a7c70; --accent-soft: #d9f1ec; --accent-ink: #ffffff; --ring: rgba(10,124,112,.55);
  --ok: #1f7a3a; --ok-soft: #dcf3e3; --warn: #9a5b00; --warn-soft: #fbeccf; --bad: #b42318; --bad-soft: #fde3df;
  --shadow: 0 1px 2px rgba(19,27,38,.05), 0 10px 28px -14px rgba(19,27,38,.22);
  --glow: radial-gradient(60% 50% at 85% 0%, rgba(10,124,112,.12), transparent 70%);
  /* 示意畫面用的顏色 */
  --frame: #c9d1db; --win-bar: #e8ecf1; --win-sel: #cfe6f7; --menu: #ffffff; --folder: #e8b33a; --folder-ink: #8a6200;
  --doc: #ffffff; --doc-line: #9aa6b5;
  --con-bg: #0c0c0c; --con-fg: #cfd6de; --con-dim: #8a96a5; --con-hi: #5fe0c9;
  --ss-bg: #1f5fa8; --ss-fg: #ffffff; --ss-btn: #ffffff; --ss-btn-ink: #1f5fa8;
  --tg-bar: #2aabee; --tg-bar-fg: #ffffff; --tg-chat: #dfe7ee; --tg-in: #ffffff; --tg-in-fg: #131b26;
  --tg-out: #effdde; --tg-out-fg: #131b26; --tg-link: #1a73c5; --tg-compose: #f4f7f9;
  --display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f14; --surface: #121924; --sunken: #0d131b; --line: #1f2b3b; --line-2: #2d3b4f;
    --ink: #dbe4ef; --muted: #aab6c6; --faint: #7f90a7;
    --accent: #35e0c4; --accent-soft: #123b38; --accent-ink: #06201c; --ring: rgba(53,224,196,.6);
    --ok: #57d98a; --ok-soft: #10301e; --warn: #e6b04e; --warn-soft: #3a2a0b; --bad: #ff8a7a; --bad-soft: #43171a;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 14px 36px -16px rgba(0,0,0,.75);
    --glow: radial-gradient(60% 50% at 85% 0%, rgba(53,224,196,.13), transparent 70%);
    --frame: #2b3948; --win-bar: #1a2433; --win-sel: #18394f; --menu: #1b2533; --folder: #d9a531; --folder-ink: #6b4b00;
    --doc: #dfe5ec; --doc-line: #6e7b8c;
    --ss-bg: #1d4f8a; --ss-btn: #e9f1fb; --ss-btn-ink: #163f6e;
    --tg-bar: #17212b; --tg-bar-fg: #e6edf3; --tg-chat: #0e1621; --tg-in: #182533; --tg-in-fg: #e6edf3;
    --tg-out: #2b5278; --tg-out-fg: #ffffff; --tg-link: #6ab3f3; --tg-compose: #17212b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f14; --surface: #121924; --sunken: #0d131b; --line: #1f2b3b; --line-2: #2d3b4f;
  --ink: #dbe4ef; --muted: #aab6c6; --faint: #7f90a7;
  --accent: #35e0c4; --accent-soft: #123b38; --accent-ink: #06201c; --ring: rgba(53,224,196,.6);
  --ok: #57d98a; --ok-soft: #10301e; --warn: #e6b04e; --warn-soft: #3a2a0b; --bad: #ff8a7a; --bad-soft: #43171a;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 14px 36px -16px rgba(0,0,0,.75);
  --glow: radial-gradient(60% 50% at 85% 0%, rgba(53,224,196,.13), transparent 70%);
  --frame: #2b3948; --win-bar: #1a2433; --win-sel: #18394f; --menu: #1b2533; --folder: #d9a531; --folder-ink: #6b4b00;
  --doc: #dfe5ec; --doc-line: #6e7b8c;
  --ss-bg: #1d4f8a; --ss-btn: #e9f1fb; --ss-btn-ink: #163f6e;
  --tg-bar: #17212b; --tg-bar-fg: #e6edf3; --tg-chat: #0e1621; --tg-in: #182533; --tg-in-fg: #e6edf3;
  --tg-out: #2b5278; --tg-out-fg: #ffffff; --tg-link: #6ab3f3; --tg-compose: #17212b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); background-image: var(--glow); background-repeat: no-repeat;
  color: var(--ink); font: 19px/1.75 var(--body); }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
code { font-family: var(--mono); font-size: .88em; background: var(--sunken); border: 1px solid var(--line); padding: 1px 7px; border-radius: 7px; }
p { margin: 0; }

.wrap { width: min(1120px, 100%); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 頁首：品牌、全部步驟、進度條 */
.top { padding-block: 14px 6px; display: grid; gap: 12px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 18px; }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-weight: 700; font-size: 20px; flex: none; }
.brand small { color: var(--faint); font-weight: 500; font-size: 15px; }
.toc { position: relative; }
.toc summary { list-style: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-size: 16px; font-weight: 500; color: var(--ink); }
.toc summary::-webkit-details-marker { display: none; }
.toc summary svg { width: 18px; height: 18px; }
.toc-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(380px, calc(100vw - 32px));
  max-height: min(70vh, 560px); overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 8px; }
.toc-panel ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc-panel .ch { font-size: 13px; color: var(--faint); letter-spacing: .08em; padding: 10px 10px 2px; }
.toc-panel a { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink);
  font-size: 16px; line-height: 1.45; min-height: 44px; align-items: center; }
.toc-panel a .n { flex: none; width: 2.2em; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.toc-panel a:hover { background: var(--sunken); }
.toc-panel a[aria-current="step"] { background: var(--accent-soft); font-weight: 700; }

.progress { display: grid; gap: 6px; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.step-count { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.step-count .of { color: var(--faint); font-weight: 500; }
.chapter { font-size: 15px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .35s ease; }
.branch-tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

.resume { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 14px; border-radius: var(--r);
  background: var(--accent-soft); color: var(--ink); font-size: 17px; }
.resume .btn { min-height: 44px; font-size: 16px; padding: 6px 16px; }

/* 一步 */
main { padding-block: 14px 0; }
.stage { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.text { display: grid; gap: 14px; min-width: 0; }
.stage h1 { font-family: var(--display); font-weight: 700; font-size: clamp(27px, 6.2vw, 38px); line-height: 1.3; margin: 0; text-wrap: balance; }
.stage h1:focus { outline: none; }
.body { display: grid; gap: 10px; max-width: 34em; }
.body p { font-size: 19px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.tips { display: grid; gap: 10px; }
.tip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 12px 14px; border-radius: 12px;
  background: var(--sunken); border: 1px solid var(--line); font-size: 17px; line-height: 1.65; }
.tip .k { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; margin-top: 2px; background: var(--surface); color: var(--muted); border: 1px solid var(--line-2); }
.tip.if .k { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tip.warn { background: var(--bad-soft); border-color: transparent; }
.tip.warn .k { background: var(--surface); color: var(--bad); border-color: transparent; }
.tip.wip { background: var(--warn-soft); border-color: transparent; }
.tip.wip .k { background: var(--surface); color: var(--warn); border-color: transparent; }
.tip.ok { background: var(--ok-soft); border-color: transparent; }
.tip.ok .k { background: var(--surface); color: var(--ok); border-color: transparent; }
.tip > span:last-child { min-width: 0; overflow-wrap: anywhere; }

.figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.mock { min-width: 0; padding: 18px 14px 26px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); overflow: hidden; display: grid; justify-items: center; }
.mock > * { width: 100%; max-width: 100%; }
.figure figcaption { font-size: 14px; color: var(--faint); text-align: center; }

/* 按鈕 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; border-radius: 14px;
  border: 2px solid var(--line-2); background: var(--surface); color: var(--ink); font: 700 19px/1.3 var(--body); text-decoration: none; cursor: pointer; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.04); }
.btn[disabled] { opacity: .4; cursor: default; filter: none; }

.navbar { position: sticky; bottom: 0; z-index: 20; margin-top: 26px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.navbar .btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; }
.navbar .btn { width: 100%; min-height: 60px; font-size: 20px; white-space: nowrap; padding-inline: 12px; }
.kbd-hint { display: none; text-align: center; font-size: 13px; color: var(--faint); margin-top: 6px; }

footer { padding-block: 22px 28px; }
.stamp { font-family: var(--mono); font-size: 11px; color: var(--faint); opacity: .7; overflow-wrap: anywhere; text-align: center; }

@media (min-width: 900px) {
  body { font-size: 20px; }
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto 1fr; gap: 22px 40px; padding-top: 10px; }
  .stage > .text { grid-column: 1; grid-row: 1; }
  .stage > .tips { grid-column: 1; grid-row: 2; align-self: start; }
  .stage > .figure { grid-column: 2; grid-row: 1 / span 2; }
  .body p { font-size: 20px; }
  .navbar .btns { grid-template-columns: 220px 320px; justify-content: end; }
  .kbd-hint { display: block; text-align: right; }
  .mock { padding: 26px 24px 34px; }
}

/* ── 標出要按的地方：脈動的圈＋小標籤 ─────────────────────────── */
.hl.room-b { margin-bottom: 42px !important; }
.hl.room-a { margin-top: 42px !important; }
.wb > .hl, .frame-l > .hl { justify-self: start; }
.row > .hl { align-self: flex-start; }
.kb .r { align-items: end; }
span.hl { display: inline-block; }
.hl { position: relative; z-index: 2; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--ring); }
.hl::after { content: ""; position: absolute; inset: -4px; border-radius: 12px; border: 3px solid var(--accent); pointer-events: none;
  animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.25); } }
.tap { position: absolute; z-index: 5; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); font: 700 14px/1.2 var(--body); padding: 6px 10px; border-radius: 9px;
  box-shadow: 0 6px 16px -6px rgba(0,0,0,.45); pointer-events: none; letter-spacing: .02em; }
.tap::before { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--accent); }
.tap.bs { left: 0; transform: none; } .tap.bs::before { left: 18px; }
.tap.be { left: auto; right: 0; transform: none; } .tap.be::before { left: auto; right: 12px; }
.tap.a, .tap.as, .tap.ae { top: auto; bottom: calc(100% + 12px); }
.tap.a::before, .tap.as::before, .tap.ae::before { top: auto; bottom: -6px; border-bottom: 0; border-top: 6px solid var(--accent); }
.tap.as { left: 0; transform: none; } .tap.as::before { left: 18px; }
.tap.ae { left: auto; right: 0; transform: none; } .tap.ae::before { left: auto; right: 12px; }
.tap.r { top: 50%; left: calc(100% + 12px); transform: translateY(-50%); }
.tap.r::before { top: 50%; left: -6px; margin: -6px 0 0; border: 6px solid transparent; border-left: 0; border-right-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  .hl::after { animation: none; opacity: .5; transform: none; }
  .bar i { transition: none; }
}

/* ── 示意畫面：共用 ─────────────────────────────────────────── */
.m-sm { font-size: 13.5px; line-height: 1.5; }
.win { border: 1px solid var(--frame); border-radius: 10px; overflow: hidden; background: var(--surface); color: var(--ink);
  box-shadow: 0 14px 30px -18px rgba(0,0,0,.5); font-size: 14px; line-height: 1.5; text-align: left; }
.win .tb { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; background: var(--win-bar); font-size: 13px; }
.win .tb .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win .tb .c { letter-spacing: 6px; color: var(--faint); flex: none; font-size: 12px; }
.win .wb { padding: 14px; display: grid; gap: 9px; grid-template-columns: minmax(0, 1fr); }
.win .wb > *, .frame-l > * { min-width: 0; }
.b { display: inline-flex; align-items: center; justify-content: center; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--sunken); color: var(--ink); font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.b.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.b.dis { opacity: .45; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.row > .field { min-width: 0; flex-basis: 140px; }
.field { border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px; background: var(--sunken); font-family: var(--mono); font-size: 12.5px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radio, .check { display: inline-flex; align-items: flex-start; gap: 7px; }
.radio i, .check i { flex: none; width: 15px; height: 15px; margin-top: 3px; border: 1.6px solid var(--faint); display: inline-block; }
.radio i { border-radius: 50%; }
.check i { border-radius: 3px; }
.radio.on i { border-color: var(--accent); box-shadow: inset 0 0 0 3.5px var(--surface), inset 0 0 0 9px var(--accent); }
.check.on i { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2.5px var(--surface); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.sep { height: 1px; background: var(--line); margin: 4px 0; }
.frame-l { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px 10px; display: grid; gap: 6px; position: relative; grid-template-columns: minmax(0, 1fr); }
.frame-l > .lg { font-size: 12px; color: var(--faint); margin-top: -2px; }
.pre { white-space: pre-line; }

/* 安裝精靈（Tk 視窗） */
.wz-step { font-size: 12.5px; color: var(--faint); }
.wz-h { font-size: 18px; font-weight: 700; margin-top: -4px; }
.wz-nav { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }

    var m = /^#step-(\d+)$/.exec(location.hash);
    if (m) { var n = +m[1]; return n >= 1 && n <= TOTAL ? MAIN[n - 1] : null; }
    var b = /^#step-([a-z0-9-]+)$/.exec(location.hash);
    if (b) { var s = byId(b[1]); return s && s.branch ? s : null; }
    return null;
  }
  function save(step) { try { localStorage.setItem(KEY, JSON.stringify({ step: step.id, at: Date.now() })); } catch (e) { /* 私密視窗：不記也沒關係 */ } }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); return v && byId(v.step) ? byId(v.step) : null; } catch (e) { return null; } }

  var current = null;
  function go(step) { if (!step) { return; } if (location.hash === hashFor(step)) { render(step); } else { location.hash = hashFor(step); } }

  function tipLabel(k) { return { "if": "如果", note: "小提示", warn: "注意", wip: "⏳ 尚未完成", ok: "好消息" }[k] || "小提示"; }

  function render(step, quiet) {
    current = step;
    var n = numberOf(step.id);
    $("title").innerHTML = step.title;
    document.title = (step.branch ? "選讀" : "步驟 " + n) + "：" + step.title.replace(/<[^>]+>/g, "") + " · SYNOX 安裝教學";
    $("body").innerHTML = step.body.map(function (p) { return "<p>" + p + "</p>"; }).join("");
    var links = (step.links || []).map(function (l) {
      return '<a class="btn ' + (l.primary ? "primary" : "soft") + '" href="' + l.href + '" target="_blank" rel="noopener">' + (I[l.icon] || "") + l.text + '</a>';
    });
    if (step.jump) { links.push('<button class="btn" type="button" data-jump="' + step.jump.to + '">' + I.branch + step.jump.text + '</button>'); }
    $("links").innerHTML = links.join("");
    $("links").hidden = !links.length;
    $("tips").innerHTML = (step.tips || []).map(function (t) {
      return '<p class="tip ' + t.k + '"><span class="k">' + tipLabel(t.k) + '</span><span>' + t.t + '</span></p>';
    }).join("");
    $("tips").hidden = !(step.tips || []).length;

    var mock = $("mock");
    mock.innerHTML = MOCKS[step.mock] ? MOCKS[step.mock]() : "";
    (step.targets || []).forEach(function (t) {
      var el = mock.querySelector('[data-hl="' + t.id + '"]');
      if (!el) { if (window.console) { console.warn("找不到要標的東西：" + step.id + " / " + t.id); } return; }
      el.classList.add("hl");
      var pl = t.place || "b";
      if (pl !== "r") { el.classList.add(pl.charAt(0) === "a" ? "room-a" : "room-b"); }
      var tap = document.createElement("span");
      tap.className = "tap " + (t.place || "b");
      tap.textContent = t.say;
      el.appendChild(tap);
    });
    $("caption").textContent = step.mock === "welcome" || step.mock === "done" ? "" : "示意圖：畫的是你會看到的畫面，顏色、字型會跟你的電腦有一點不同。";
    $("caption").hidden = !$("caption").textContent;

    // 進度
    var shown = step.branch ? numberOf(step.back) : n;
    $("count").innerHTML = step.branch ? '<span class="branch-tag">選讀</span>' : "步驟 " + n + '<span class="of">／' + TOTAL + "</span>";
    $("chapter").textContent = step.chapter;
    $("bar-fill").style.width = (shown / TOTAL * 100) + "%";
    $("bar").setAttribute("aria-valuenow", String(shown));
    $("bar").setAttribute("aria-valuemax", String(TOTAL));
    $("bar").setAttribute("aria-valuetext", step.branch ? "選讀" : "步驟 " + n + "，共 " + TOTAL + " 步");

    // 按鈕
    var prev = $("prev"), next = $("next");
    prev.disabled = !step.branch && n === 1;
    prev.lastChild.textContent = step.branch ? "回去" : "上一步";
    var arrow = next.querySelector("svg");
    if (step.branch) { next.firstChild.textContent = "接著做"; }
    else if (n === TOTAL) { next.firstChild.textContent = "從頭再看一次"; }
    else { next.firstChild.textContent = "下一步"; }
    arrow.style.display = n === TOTAL && !step.branch ? "none" : "";

    // 目錄
    Array.prototype.forEach.call(document.querySelectorAll("#toc-panel a"), function (a) {
      if (a.getAttribute("href") === hashFor(step)) { a.setAttribute("aria-current", "step"); } else { a.removeAttribute("aria-current"); }
    });
    $("toc").open = false;
    if (n !== 1) { $("resume").hidden = true; }
    if (!quiet) { save(step); }
  }

  function nextStep() {
    if (!current) { return; }
    if (current.branch) { go(byId(current.next)); return; }
    var n = numberOf(current.id);
    go(n === TOTAL ? MAIN[0] : MAIN[n]);
  }
  function prevStep() {
    if (!current) { return; }
    if (current.branch) { go(byId(current.back)); return; }
    var n = numberOf(current.id);
    if (n > 1) { go(MAIN[n - 2]); }
  }
  function moved() {
    var s = fromHash() || MAIN[0];
    render(s);
    try { window.scrollTo(0, 0); } catch (e) { /* 沒關係 */ }
    try { $("title").focus({ preventScroll: true }); } catch (e) { $("title").focus(); }
  }

  // 目錄
  (function () {
    var html = "", last = "";
    MAIN.forEach(function (s, i) {
      if (s.chapter !== last) { html += (last ? "</ol>" : "") + '<p class="ch">' + s.chapter + "</p><ol>"; last = s.chapter; }
      html += '<li><a href="#step-' + (i + 1) + '"><span class="n">' + (i + 1) + "</span><span>" + s.title.replace(/<[^>]+>/g, "") + "</span></a></li>";
    });
    STEPS.filter(function (s) { return s.branch; }).forEach(function (s) {
      html += '</ol><p class="ch">選讀</p><ol><li><a href="#step-' + s.id + '"><span class="n">＋</span><span>' + s.title + "</span></a></li>";
    });
    $("toc-panel").innerHTML = html + "</ol>";
  })();

  $("next").addEventListener("click", nextStep);
  $("prev").addEventListener("click", prevStep);
  $("links").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-jump]") : null;
    if (b) { go(byId(b.getAttribute("data-jump"))); }
  });
  $("toc-panel").addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a") : null;
    if (a) { $("toc").open = false; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) { return; }
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) { return; }
    if (e.key === "ArrowRight") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
    else if (e.key === "Escape") { $("toc").open = false; }
  });
  window.addEventListener("hashchange", moved);

  // 第一次打開：網址有 #step-N 就去那一步；沒有的話，記得上次看到哪裡就問要不要接著看
  var start = fromHash();
  var saved = load();
  render(start || MAIN[0], !start);
  if (!start && saved && saved.id !== MAIN[0].id) {
    $("resume-text").textContent = "上次看到「" + (saved.branch ? "選讀" : "步驟 " + numberOf(saved.id)) + "：" + saved.title.replace(/<[^>]+>/g, "") + "」";
    $("resume").hidden = false;
    $("resume-go").addEventListener("click", function () { $("resume").hidden = true; go(saved); });
    $("resume-no").addEventListener("click", function () { $("resume").hidden = true; save(MAIN[0]); });
  }
  window.SynoxGuide = { STEPS: STEPS, go: function (id) { go(byId(id)); } };
})();
</script>
</body>
</html>
