<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登入 SYNOX</title><style>:root{--bg:#f3f5f8;--surface:#fff;--line:#e2e7ee;--text:#131b26;--muted:#6a7687;--accent:#0a7c70;--accent-ink:#fff;--accent-soft:#e0f2ef;--warn-soft:#fdf1dc;--warn:#9a6400;color-scheme:light dark}@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--surface:#121924;--line:#1f2b3b;--text:#dbe4ef;--muted:#7f90a7;--accent:#35e0c4;--accent-ink:#04221d;--accent-soft:rgba(53,224,196,.12);--warn-soft:rgba(255,180,84,.12);--warn:#ffb454}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}.card{width:min(500px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 10px 30px -10px rgba(19,27,38,.22)}.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px;font-weight:800;font-size:20px;color:var(--accent-ink);background:var(--accent)}h1{font-size:22px;margin:0 0 10px}p{margin:10px 0}.big{font-size:1.15em}.muted{color:var(--muted);font-size:14px}.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px}a{color:var(--accent)}button{font:inherit;font-weight:650;font-size:16px;min-height:44px;padding:8px 26px;margin-top:8px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style></head><body><main class="card"><div class="mark" aria-hidden="true">S</div><h1>登入 SYNOX</h1><p class="big">你將以 <b>小明（id 100001）</b> 登入。</p><p class="muted">這不是你的帳號（例如別人傳給你的連結）就<b>不要按</b>，直接關掉這一頁。</p><form method="post" action="/login"><input type="hidden" name="f" value="preview"><button type="submit">登入</button></form></main></body></html>
