<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SYNOX 手機入口</title>
<link rel="stylesheet" href="/_synox/enter.css">
</head>
<body>
<main class="enter">
  <h1>SYNOX 手機入口</h1>
  <p id="enter-what">打開手機上的驗證器 App，輸入現在顯示的 6 位數（要比開入口時用的那組新）。</p>
  <form id="enter-form" autocomplete="off">
    <input id="enter-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="6 位數">
    <button type="submit">進去</button>
  </form>
  <p id="enter-msg" class="msg" role="status"></p>
  <p class="small">連結只能用一次。不是你自己開的入口，請不要輸入，並在 Telegram 打 /app_close。</p>
</main>
<script src="/_synox/enter.js"></script>
</body>
</html>
