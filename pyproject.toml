[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synox"
version = "0.1.0"
description = "SYNOX: a one-click Telegram agent host (ISDTeleKitSDK + pluggable LLM + skill packs + vault)"
requires-python = ">=3.11"
# isdtelekit is vendored (vendor/isdtelekit, see scripts/vendor_sdk.py); it only needs requests.
dependencies = ["requests>=2.28", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# API-key LLM providers (openai / anthropic / gemini / openai_compat) go through the owner's ntu_easy_llm.
# Not on PyPI yet: install the wheel by hand until it is released; then switch to the direct URL
# (see docs/AGENT.md "ntu_easy_llm"). Claude Code, the fake AI and "no AI" work without it.
llm = ["ntu_easy_llm>=0.5.0"]

[project.scripts]
synox = "synox.__main__:main"

# Two source roots: src/synox (ours) and vendor/isdtelekit (verbatim SDK copy).
# `pip install -e .` makes both importable.
[tool.setuptools.packages.find]
where = ["src", "vendor"]
include = ["synox*", "isdtelekit*"]

[tool.setuptools.package-data]
synox = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
