# Build SYNOX-Setup-<version>.exe on a clean GitHub-hosted Windows runner, the way docs/adr/0003 (B) describes:
# official embeddable CPython (pinned + sha256) -> requirements.lock + offline wheelhouse -> SYNOX_Libs tools zip
# (pinned + sha256) -> optional tkinter from the same full CPython -> scripts/stage_installer.py -> Inno Setup (pinned
# + sha256) -> artifact. On a v* tag the exe is attached to a DRAFT release; nothing is ever published automatically.
# How to run it, where the exe lands and how to test it: docs/release-build.md. Unsigned (no secrets used).
#
# Every pin lives in `env:` below. To bump one: change the version AND its sha256 together (docs/release-build.md
# says where each checksum comes from). Third-party actions are pinned to full commit SHAs.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      tkinter:
        description: "Bundle tkinter from the matching full CPython (--tk-from) so the window wizard can open"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  # Official "Windows embeddable package (64-bit)" from python.org. Keep equal to $EmbedVersion in setup/bootstrap.ps1
  # and to the CPython that actions/setup-python installs (wheels and tkinter must match X.Y.Z).
  PYTHON_VERSION: "3.12.10"
  PYTHON_EMBED_SHA256: "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
  # Tool library: SYNOX_Libs release asset (index.json + every .synoxpack, under tools/ inside the zip).
  LIBS_REPO: "ChouYangEn0401/SYNOX_Libs"
  LIBS_TAG: "v0.2.0"
  LIBS_TOOLS_ZIP: "tools-0.2.0.zip"
  LIBS_TOOLS_SHA256: "f573252dfbbb374c427bc7b2091ac09cacf50b3747ec0b9c970517d047d6658c"
  # Inno Setup 6 (synox.iss is written for 6.x), official installer from the jrsoftware/issrc GitHub release.
  INNO_VERSION: "6.7.4"
  INNO_TAG: "is-6_7_4"
  INNO_SHA256: "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
  INNO_SIGNER: "Pyrsys B.V."
  # Wheels shipped next to requirements.lock so bootstrap can build .venv offline from runtime\python.
  PIP_VERSION: "26.3"
  VIRTUALENV_VERSION: "21.15.6"
  SETUPTOOLS_VERSION: "84.2.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build SYNOX-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    env:
      WITH_TK: ${{ github.event_name != 'workflow_dispatch' || inputs.tkinter }}
    steps:
      - name: Check out SYNOX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the full CPython of the same version (build venv, wheel tags, tkinter source)
        id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          check-latest: false
          update-environment: false

      - name: Read the version (pyproject.toml == synox.__version__; a tag must be v<version>)
        id: version
        env:
          PY: ${{ steps.py.outputs.python-path }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $actual = (& $env:PY -c "import sys; print('%d.%d.%d' % sys.version_info[:3])").Trim()
          if ($actual -ne $env:PYTHON_VERSION) { throw "setup-python gave $actual, expected $env:PYTHON_VERSION" }
          $cmd = @('scripts/installer_ci.py', 'version')
          if ($env:TAG) { $cmd += @('--tag', $env:TAG) }
          $version = (& $env:PY @cmd).Trim()
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=SYNOX-Setup-$version-$short" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "SYNOX $version ($short), tkinter: $env:WITH_TK"

      - name: Pre-publication scan of the checked-out files (secrets, local paths, personal e-mails)
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PY scripts/prepublish_check.py --worktree-only

      - name: Static check of the installer script (12 languages, pages, tasks, texts)
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PY scripts/installer_ci.py check-iss

      - name: Download pinned inputs and verify sha256
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dl = Join-Path $env:RUNNER_TEMP 'downloads'
          & $env:PY scripts/installer_ci.py fetch "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" --sha256 $env:PYTHON_EMBED_SHA256 --out (Join-Path $dl 'python-embed.zip')
          & $env:PY scripts/installer_ci.py fetch "https://github.com/$env:LIBS_REPO/releases/download/$env:LIBS_TAG/$env:LIBS_TOOLS_ZIP" --sha256 $env:LIBS_TOOLS_SHA256 --out (Join-Path $dl 'tools.zip')
          & $env:PY scripts/installer_ci.py fetch "https://github.com/jrsoftware/issrc/releases/download/$env:INNO_TAG/innosetup-$env:INNO_VERSION.exe" --sha256 $env:INNO_SHA256 --out (Join-Path $dl 'innosetup.exe')
          & $env:PY scripts/installer_ci.py extract (Join-Path $dl 'python-embed.zip') --out (Join-Path $env:RUNNER_TEMP 'python-embed')
          & $env:PY scripts/installer_ci.py extract (Join-Path $dl 'tools.zip') --out (Join-Path $env:RUNNER_TEMP 'libs')
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'libs\tools\index.json'))) { throw "$env:LIBS_TOOLS_ZIP has no tools/index.json" }
          # Second, independent check: both executables carry a valid Authenticode signature from the expected publisher.
          $checks = @(
            @{ File = (Join-Path $env:RUNNER_TEMP 'python-embed\python.exe'); Signer = 'Python Software Foundation' },
            @{ File = (Join-Path $dl 'innosetup.exe'); Signer = $env:INNO_SIGNER }
          )
          foreach ($c in $checks) {
            $sig = Get-AuthenticodeSignature -LiteralPath $c.File
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike "*$($c.Signer)*") {
              throw "$($c.File): signature $($sig.Status) by '$($sig.SignerCertificate.Subject)', expected '$($c.Signer)'"
            }
            Write-Host "signed OK: $(Split-Path -Leaf $c.File) <- $($sig.SignerCertificate.Subject)"
          }

      - name: Install Inno Setup ${{ env.INNO_VERSION }} (verified installer, silent, into RUNNER_TEMP)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $exe = Join-Path $env:RUNNER_TEMP 'downloads\innosetup.exe'
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found in $dir" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build venv -> requirements.lock -> offline wheelhouse (cp312 win_amd64) -> lock with sha256
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $venv = Join-Path $env:RUNNER_TEMP 'buildvenv'
          $wh = Join-Path $env:RUNNER_TEMP 'wheelhouse'
          $records = Join-Path $env:RUNNER_TEMP 'records'
          New-Item -ItemType Directory -Force -Path $records | Out-Null
          & $env:PY -m venv $venv
          $vpy = Join-Path $venv 'Scripts\python.exe'
          & $vpy -m pip install -q "pip==$env:PIP_VERSION"
          if (Test-Path -LiteralPath requirements.lock) {
            Write-Host "requirements.lock is committed: installing exactly those versions first"
            & $vpy -m pip install -q -r requirements.lock
          }
          & $vpy -m pip install -q .
          & $vpy scripts/lock_deps.py
          Copy-Item requirements.lock (Join-Path $records 'requirements-unhashed.lock')
          & $vpy -m pip download -q -r requirements.lock -d $wh --only-binary=:all:
          & $vpy -m pip download -q "pip==$env:PIP_VERSION" "virtualenv==$env:VIRTUALENV_VERSION" "setuptools==$env:SETUPTOOLS_VERSION" -d $wh --only-binary=:all:
          & $vpy scripts/lock_deps.py --wheelhouse $wh
          & $vpy scripts/lock_deps.py --check
          Copy-Item requirements.lock (Join-Path $records 'requirements.lock')
          # make_zip.release_files ships git-tracked files only: put the generated lock in the index of this
          # throw-away checkout so the stage includes it. Nothing is committed or pushed.
          git add -- requirements.lock
          Get-Content requirements.lock
          Get-ChildItem $wh | ForEach-Object { $_.Name }
          "BUILD_PY=$vpy" >> $env:GITHUB_ENV
          "WHEELHOUSE=$wh" >> $env:GITHUB_ENV

      - name: Stage the installer contents (scripts/stage_installer.py, copy only)
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cmd = @('scripts/stage_installer.py',
                   '--python-embed', (Join-Path $env:RUNNER_TEMP 'python-embed'),
                   '--wheelhouse', $env:WHEELHOUSE,
                   '--tools', (Join-Path $env:RUNNER_TEMP 'libs\tools'),
                   '--out', (Join-Path $env:RUNNER_TEMP 'stage'))
          if ($env:WITH_TK -eq 'true') { $cmd += @('--tk-from', (Split-Path -Parent $env:PY)) }
          & $env:BUILD_PY @cmd
          $manifest = Join-Path $env:RUNNER_TEMP 'stage\SYNOX\STAGE-MANIFEST.txt'
          Get-Content $manifest
          Copy-Item $manifest (Join-Path $env:RUNNER_TEMP 'records\STAGE-MANIFEST.txt')

      - name: Compile with Inno Setup (ISCC /DAppVersion from pyproject.toml)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP 'stage\SYNOX'
          & $env:ISCC /Qp "/DAppVersion=$env:VERSION" "/DStageDir=$stage" setup\installer\synox.iss
          $name = "SYNOX-Setup-$env:VERSION.exe"
          $exe = Join-Path 'dist' $name
          if (-not (Test-Path -LiteralPath $exe)) { throw "ISCC did not produce $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
          $mb = [math]::Round((Get-Item -LiteralPath $exe).Length / 1MB, 1)
          @(
            "## SYNOX-Setup-$env:VERSION.exe",
            "",
            "- sha256: ``$hash``  ($mb MB, unsigned)",
            "- Python $env:PYTHON_VERSION embeddable; tkinter bundled: $env:WITH_TK",
            "- tools: $env:LIBS_REPO $env:LIBS_TAG ($env:LIBS_TOOLS_ZIP); Inno Setup $env:INNO_VERSION",
            "- pip $env:PIP_VERSION, virtualenv $env:VIRTUALENV_VERSION, setuptools $env:SETUPTOOLS_VERSION"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/SYNOX-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build records (requirements.lock with and without hashes, STAGE-MANIFEST.txt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-records-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/records/
          if-no-files-found: error
          retention-days: 30

      - name: Offline smoke test of the stage (what bootstrap does with runtime\python; no Setup.bat, no network index)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $parent = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $parent | Out-Null
          Copy-Item -Recurse -LiteralPath (Join-Path $env:RUNNER_TEMP 'stage\SYNOX') -Destination $parent
          $S = Join-Path $parent 'SYNOX'
          $wh = Join-Path $S 'wheelhouse'
          $rt = Join-Path $S 'runtime\python\python.exe'
          & $rt -c "import sys; print(sys.version)"
          $pipWheel = Get-ChildItem -LiteralPath $wh -Filter 'pip-*.whl' | Select-Object -First 1
          & $rt (Join-Path $pipWheel.FullName 'pip') install --disable-pip-version-check --no-warn-script-location -q --no-index --find-links $wh pip virtualenv
          & $rt -m virtualenv (Join-Path $S '.venv')
          $vpy = Join-Path $S '.venv\Scripts\python.exe'
          & $vpy -m pip install -q --no-index --find-links $wh -r (Join-Path $S 'requirements.lock')
          & $vpy -m pip install -q --no-index --find-links $wh --no-deps -e $S
          Push-Location $S
          try {
            & $vpy -c "import synox, isdtelekit, requests, cryptography, websocket, synox.config as c; print(synox.__version__, c.ROOT)"
            & $vpy -m synox tools list
            try { & $vpy -m synox doctor --offline } catch { Write-Host "::warning::doctor --offline did not exit 0 (no config.json yet): $_" }
            if ($env:WITH_TK -eq 'true') {
              try { & $vpy -c "import tkinter; print('tcl', tkinter.Tcl().eval('info patchlevel'))" }
              catch { Write-Host "::warning::tkinter does not load inside .venv: Setup would fall back to the text synox init (ADR 0003 QD3)" }
            }
          } finally { Pop-Location }
          $global:LASTEXITCODE = 0   # the two checks above are warnings only; the runner's wrapper exits with LASTEXITCODE

      - name: Clean-room check (scripts/clean_room_check.py; informational until it has passed on CI once)
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:BUILD_PY -m pip install -q pytest
          & $env:BUILD_PY scripts/clean_room_check.py --tools (Join-Path $env:RUNNER_TEMP 'libs\tools')

  draft-release:
    name: Attach to a DRAFT GitHub release (tags only; never published here)
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the installer built above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - name: Create the draft release, or replace the files on an existing DRAFT
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          files=(release/SYNOX-Setup-*.exe release/SHA256SUMS.txt)
          ls -l "${files[@]}"
          if state=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::Release $TAG is already published; this workflow only ever touches drafts."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            {
              echo "SYNOX $VERSION Windows installer (draft created by the build workflow; review, then publish by hand)."
              echo
              echo "- Unsigned: Windows SmartScreen will warn on first run (More info -> Run anyway)."
              echo "- sha256: see SHA256SUMS.txt"
              echo "- Built by: $RUN_URL"
              echo "- Test before publishing: docs/release-build.md and docs/handoff/clean-machine-test.md (B)"
            } > notes.md
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --draft --verify-tag --title "SYNOX $VERSION" --notes-file notes.md
          fi
